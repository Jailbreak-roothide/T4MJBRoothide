name: Auto Update Repo

on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils

      - name: Scan all deb files
        run: |
          mkdir -p debs
          dpkg-scanpackages -m ./debs /dev/null > Packages
          bzip2 -k -f Packages
          xz -k -f Packages

      - name: Commit and push generated packages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Packages.xz
          git diff --staged --quiet || (git commit -m "Auto-scan and update Packages" && git push)
