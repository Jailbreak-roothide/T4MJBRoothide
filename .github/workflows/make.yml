name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Lay truc tiep ma nguon tu kho luu tru
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 3. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 4. Chay bien dich TrollStore
        run: |
          export THEOS=$HOME/theos
          # Neu code nam trong thu muc con TrollStore-2.1.1 thi vao, khong thi dung tai goc
          if [ -f "TrollStore-2.1.1/Makefile" ]; then
            cd TrollStore-2.1.1
          fi
          make clean || true
          make FINALPACKAGE=1

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: |
            **/TrollStore.tar
            **/packages/*.tar
