name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Giai nen ma nguon va cai dat dependencies
        run: |
          brew install unar libarchive ldid openssl@3
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar
          
          ROOT_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          TS_APP_DIR=$(find src_extracted -type d -name "TrollStore" | head -n 1)
          echo "TS_APP_DIR=$TS_APP_DIR" >> $GITHUB_ENV

          # Header libarchive
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          cp "$LIBARCHIVE_PREFIX/include/archive.h" "$TS_APP_DIR/"
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" "$TS_APP_DIR/"

          # Tai TrollStore 2.1.1 goc
          curl -L -o official.tar "https://github.com/opa334/TrollStore/releases/download/2.1.1/TrollStore.tar"
          mkdir -p official_extracted
          tar -xvf official.tar -C official_extracted/

      - name: 4. Bien dich fastPathSign voi day du thu vien OpenSSL & ChOma
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          cd "$ROOT_DIR"
          
          # Clone dung ban ChOma tuong thich
          rm -rf ChOma
          git clone --recursive https://github.com/opa334/ChOma.git
          
          # Fix case-sensitivity Fat.h -> FAT.h neu co
          find . -name "main.m" -exec sed -i '' 's/"Fat.h"/"FAT.h"/g' {} + 2>/dev/null || true

          cd Exploits/fastPathSign
          clang -O3 -fobjc-arc \
            -framework Foundation -framework CoreServices -framework Security \
            -I../../ChOma/src \
            -I"$OPENSSL_PREFIX/include" \
            -L"$OPENSSL_PREFIX/lib" -lcrypto \
            ../../ChOma/src/*.c \
            src/main.m src/codesign.m src/coretrust_bug.c \
            -o fastPathSign
          
          chmod 755 fastPathSign
          echo "Da build fastPathSign thanh cong!"

      - name: 5. Bien dich TrollStore va ky bypass CoreTrust
        run: |
          export THEOS=$HOME/theos
          WORKSPACE_DIR=$(pwd)
          cd "$WORKSPACE_DIR/$TS_APP_DIR"

          # 1. Bien dich app TrollStore (Theos se tu dong goi fastPathSign da build o tren)
          make clean || true
          make FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error" ADDITIONAL_OBJCFLAGS="-Wno-error"

          # 2. Chuan bi goi thanh pham
          cd "$WORKSPACE_DIR"
          rm -rf package_dir && mkdir -p package_dir
          
          # Neu Theos build ra TrollStore.app day du thi copy
          if [ -d "$TS_APP_DIR/.theos/obj/TrollStore.app" ]; then
            cp -r "$TS_APP_DIR/.theos/obj/TrollStore.app" package_dir/
          else
            cp -r official_extracted/TrollStore.app package_dir/
            cp "$TS_APP_DIR/.theos/obj/arm64/TrollStore.app/TrollStore" package_dir/TrollStore.app/
            "$ROOT_DIR/Exploits/fastPathSign/fastPathSign" package_dir/TrollStore.app/TrollStore "$TS_APP_DIR/entitlements.plist"
          fi

          # 3. Copy helper goc vao TrollStore.app
          cp official_extracted/TrollStore.app/trollstorehelper package_dir/TrollStore.app/
          cp official_extracted/TrollStore.app/PersistenceHelper package_dir/TrollStore.app/ 2>/dev/null || true
          chmod 755 package_dir/TrollStore.app/trollstorehelper
          chmod 755 package_dir/TrollStore.app/TrollStore

          # 4. Dong goi tar
          cd package_dir
          tar -cvf ../TrollStore.tar TrollStore.app
          cd ..

      - name: 6. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: TrollStore.tar
