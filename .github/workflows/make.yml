name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Giai nen ma nguon va cai dat moi truong
        run: |
          brew install unar libarchive ldid openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "DYLD_LIBRARY_PATH=$OPENSSL_PREFIX/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

          # Tai va giai nen file ma nguon Tieng Viet cua ban
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar
          
          ROOT_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          TS_APP_DIR=$(find src_extracted -type d -name "TrollStore" | head -n 1)
          echo "TS_APP_DIR=$TS_APP_DIR" >> $GITHUB_ENV

          # Chuan bi header archive cho TrollStore
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          cp "$LIBARCHIVE_PREFIX/include/archive.h" "$TS_APP_DIR/"
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" "$TS_APP_DIR/"

          # Tai TrollStore 2.1.1 chinh thuc de lay helper goc
          curl -L -o official.tar "https://github.com/opa334/TrollStore/releases/download/2.1.1/TrollStore.tar"
          mkdir -p official_extracted
          tar -xvf official.tar -C official_extracted/

      - name: 4. Bien dich fastPathSign voi ChOma 2.1.1 chuan
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          
          # Clone dung ban TrollStore 2.1.1 goc de lay ChOma tuong thich 100%
          git clone --depth 1 --branch 2.1.1 https://github.com/opa334/TrollStore.git ts_official
          cd ts_official
          git submodule update --init --recursive
          cd ..

          # Bien dich fastPathSign bang ma nguon va ChOma chuan cua 2.1.1
          cd ts_official/Exploits/fastPathSign
          sed -i '' 's/"Fat.h"/"FAT.h"/g' src/main.m 2>/dev/null || true
          
          clang -O3 -fobjc-arc \
            -framework Foundation -framework CoreServices -framework Security \
            -I../../ChOma/src \
            -I"$OPENSSL_PREFIX/include" \
            -L"$OPENSSL_PREFIX/lib" -lcrypto \
            ../../ChOma/src/*.c \
            src/main.m src/codesign.m src/coretrust_bug.c \
            -o fastPathSign
          
          chmod 755 fastPathSign
          
          # Chep fastPathSign vao thu muc ma nguon cua ban de Theos tu dong su dung
          cd ../../..
          mkdir -p "$ROOT_DIR/Exploits/fastPathSign"
          cp ts_official/Exploits/fastPathSign/fastPathSign "$ROOT_DIR/Exploits/fastPathSign/fastPathSign"
          chmod 755 "$ROOT_DIR/Exploits/fastPathSign/fastPathSign"
          echo "Da san sang fastPathSign!"

      - name: 5. Bien dich TrollStore Tieng Viet va ky CoreTrust
        run: |
          export THEOS=$HOME/theos
          WORKSPACE_DIR=$(pwd)
          cd "$WORKSPACE_DIR/$TS_APP_DIR"

          # Theos bien dich va se tu dong goi fastPathSign da tao o buoc 4 de ky
          make clean || true
          make FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error" ADDITIONAL_OBJCFLAGS="-Wno-error"

          # Chuan bi thu muc dong goi dua tren ban goc
          cd "$WORKSPACE_DIR"
          rm -rf package_dir && mkdir -p package_dir
          cp -r official_extracted/TrollStore.app package_dir/

          # Thay the file thuc thi TrollStore bang ban Tieng Viet da duoc ky CoreTrust
          COMPILED_BIN=$(find "$TS_APP_DIR/.theos/obj" -type f -name "TrollStore" | head -n 1)
          if [ -n "$COMPILED_BIN" ]; then
            echo "Tim thay file nhi phan TrollStore da ky CoreTrust tai: $COMPILED_BIN"
            cp "$COMPILED_BIN" package_dir/TrollStore.app/TrollStore
            chmod 755 package_dir/TrollStore.app/TrollStore
          fi

          # Giu nguyen helper goc de dam bao quyen root cao nhat
          cp official_extracted/TrollStore.app/trollstorehelper package_dir/TrollStore.app/
          cp official_extracted/TrollStore.app/PersistenceHelper package_dir/TrollStore.app/ 2>/dev/null || true
          chmod 755 package_dir/TrollStore.app/trollstorehelper

          # Chep de file giao dien / ngon ngu bo sung neu co
          find "$TS_APP_DIR" -name "*.lproj" -exec cp -r {} package_dir/TrollStore.app/ \; 2>/dev/null || true

          # Dong goi thanh pham
          cd package_dir
          tar -cvf ../TrollStore.tar TrollStore.app
          cd ..

      - name: 6. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: TrollStore.tar
