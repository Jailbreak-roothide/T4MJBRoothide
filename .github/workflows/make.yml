name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Giai nen ma nguon va chuan bi cong cu ky fastPathSign
        run: |
          brew install unar libarchive
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar
          
          ROOT_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          TS_APP_DIR=$(find src_extracted -type d -name "TrollStore" | head -n 1)
          echo "TS_APP_DIR=$TS_APP_DIR" >> $GITHUB_ENV

          # Copy header archive vao TrollStore
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          cp "$LIBARCHIVE_PREFIX/include/archive.h" "$TS_APP_DIR/"
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" "$TS_APP_DIR/"

          # Clone ChOma day du de bien dich fastPathSign cho macOS
          rm -rf "$ROOT_DIR/ChOma"
          git clone --recursive https://github.com/opa334/ChOma.git "$ROOT_DIR/ChOma"
          
          # Bien dich cong cu fastPathSign
          mkdir -p "$ROOT_DIR/Exploits/fastPathSign"
          cd "$ROOT_DIR/Exploits/fastPathSign"
          clang -framework Foundation -framework CoreServices -framework Security -fobjc-arc \
            -I../../ChOma/src \
            ../../ChOma/src/*.c \
            src/main.m src/coretrust_bug.c \
            -o fastPathSign || clang -framework Foundation -framework Security -fobjc-arc src/*.m src/*.c -o fastPathSign || true
          chmod 755 fastPathSign || true
          cd -

          # Tai TrollStore 2.1.1 goc de trich xuat trollstorehelper chuan
          curl -L -o official.tar "https://github.com/opa334/TrollStore/releases/download/2.1.1/TrollStore.tar"
          mkdir -p official_extracted
          tar -xvf official.tar -C official_extracted/

      - name: 4. Bien dich TrollStore Tieng Viet va dong goi TAR
        run: |
          export THEOS=$HOME/theos
          cd "$TS_APP_DIR"
          
          # Neu fastPathSign chua tao duoc, dung ldid lam fastPathSign de vuot qua buoc ky ma
          if [ ! -f "../Exploits/fastPathSign/fastPathSign" ]; then
            mkdir -p ../Exploits/fastPathSign
            cp $THEOS/bin/ldid ../Exploits/fastPathSign/fastPathSign
            chmod 755 ../Exploits/fastPathSign/fastPathSign
          fi

          make clean || true
          make FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error" ADDITIONAL_OBJCFLAGS="-Wno-error"
          
          # Tao thu muc thanh pham
          cd -
          rm -rf package_dir && mkdir -p package_dir
          
          # Copy TrollStore.app vua build thanh cong
          APP_PATH=$(find "$TS_APP_DIR/.theos/obj" -name "TrollStore.app" | head -n 1)
          cp -r "$APP_PATH" package_dir/
          
          # Bo sung file trollstorehelper goc vao TrollStore.app
          cp official_extracted/TrollStore.app/trollstorehelper package_dir/TrollStore.app/
          chmod 755 package_dir/TrollStore.app/trollstorehelper
          
          # Dong goi thanh TrollStore.tar
          cd package_dir
          tar -cvf ../TrollStore.tar TrollStore.app
          cd ..

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: "**/TrollStore.tar"
