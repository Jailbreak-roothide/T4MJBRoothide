name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Tai toan bo file tu Release v2.0 va giai nen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tai toan bo file dinh kem trong Release v2.0
          gh release download v2.0 -R Jailbreak-roothide/T4MJBRoothide --dir release_files
          
          # Tim va giai nen bat ky file zip nao tim thay
          find release_files -name "*.zip" -exec unzip -o {} \;

          # Tim thu muc chua Makefile tong cua TrollStore (thu muc co chua thu muc TrollStore va RootHelper)
          TARGET_DIR=$(find . -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "Da tim thay thu muc ma nguon tai: $TARGET_DIR"

      - name: 4. Chay bien dich TrollStore
        run: |
          cd $TARGET_DIR
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: |
            **/TrollStore.tar
            **/packages/*.tar
