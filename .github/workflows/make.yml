name: Tao TrollStore Lite Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TrollStore Lite Rootless (.deb)
    runs-on: macos-14

    steps:
      - name: 1. Cai dat Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p ~/theos/sdks
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Chuan bi cong cu va ma nguon
        run: |
          brew install unar ldid dpkg libarchive

          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)

          # Copy header archive vao include cua Theos
          mkdir -p $THEOS/include
          cp "$LIBARCHIVE_PREFIX/include/archive.h" $THEOS/include/
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" $THEOS/include/

          # Tai source TrollStore
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar

          # Thiet lap DUONG DAN TUYET DOI de khong bao gio bi lac khi cd
          ROOT_DIR=$(find "$GITHUB_WORKSPACE/src_extracted" -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          ROOT_HELPER_DIR="$ROOT_DIR/RootHelper"
          TS_APP_DIR="$ROOT_DIR/TrollStore"
          TS_LITE_DIR="$ROOT_DIR/TrollStoreLite"

          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          echo "ROOT_HELPER_DIR=$ROOT_HELPER_DIR" >> $GITHUB_ENV
          echo "TS_APP_DIR=$TS_APP_DIR" >> $GITHUB_ENV
          echo "TS_LITE_DIR=$TS_LITE_DIR" >> $GITHUB_ENV

          # Checkout dung commit ChOma
          rm -rf "$ROOT_DIR/ChOma"
          git clone https://github.com/opa334/ChOma.git "$ROOT_DIR/ChOma"
          cd "$ROOT_DIR/ChOma"
          git checkout 964023ddac2286ef8e843f90df64d44ac6a673df
          cd "$GITHUB_WORKSPACE"

          # Dong bo toan bo Resources tu ban goc sang Lite
          mkdir -p "$TS_LITE_DIR/Resources"
          if [ -d "$TS_APP_DIR/Resources" ]; then
            cp -r "$TS_APP_DIR/Resources/"* "$TS_LITE_DIR/Resources/" 2>/dev/null || true
          fi

      - name: 4. Bien dich RootHelper Lite (Chi lay slice arm64)
        run: |
          cd "$ROOT_HELPER_DIR"
          make clean || true

          # ARCHS="arm64" de triet tieu xung dot PAC ABI tren iOS 15-16
          make FINALPACKAGE=1 TROLLSTORE_LITE=1 THEOS_PACKAGE_SCHEME=rootless \
            ARCHS="arm64" \
            TARGET="iphone:clang:16.5:15.0" \
            ADDITIONAL_CFLAGS="-Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new" \
            ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new"

          # Lay duong dan tuyet doi cua helper binary
          HELPER_BIN=$(find "$ROOT_HELPER_DIR/.theos/obj" -type f -name "trollstorehelper_lite" -o -name "trollstorehelper" | head -n 1)
          echo "HELPER_BIN=$HELPER_BIN" >> $GITHUB_ENV
          echo "Phat hien helper binary tai: $HELPER_BIN"

          # Dat helper vao Resources cua Lite phong ho truoc
          mkdir -p "$TS_LITE_DIR/Resources"
          cp -f "$HELPER_BIN" "$TS_LITE_DIR/Resources/trollstorehelper"
          chmod 755 "$TS_LITE_DIR/Resources/trollstorehelper"

      - name: 5. Dong goi va sign chuan xac TrollStore Lite
        run: |
          cd "$TS_LITE_DIR"
          make clean || true

          # Chep lai helper vao Resources truoc khi make phong khi make clean da xoa
          mkdir -p "$TS_LITE_DIR/Resources"
          cp -f "$HELPER_BIN" "$TS_LITE_DIR/Resources/trollstorehelper"
          chmod 755 "$TS_LITE_DIR/Resources/trollstorehelper"

          # Build package TrollStore Lite
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            ARCHS="arm64" \
            TARGET="iphone:clang:16.5:15.0" \
            ADDITIONAL_CFLAGS="-Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new" \
            ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new"

          DEB_FILE=$(find "$TS_LITE_DIR/packages" -name "*.deb" | head -n 1)
          echo "Xu ly file DEB: $DEB_FILE"

          # Bung DEB de dam bao helper va entitlements 100% dung vi tri
          mkdir -p /tmp/deb_pkg
          dpkg-deb -R "$DEB_FILE" /tmp/deb_pkg

          APP_DIR=$(find /tmp/deb_pkg -type d -name "TrollStoreLite.app" | head -n 1)

          # Chep truc tiep file helper vao bundle app
          cp -f "$HELPER_BIN" "$APP_DIR/trollstorehelper"
          chmod 755 "$APP_DIR/trollstorehelper"
          chmod 755 "$APP_DIR/TrollStoreLite"

          # Tao entitlements khong bi sandbox kill cho app va helper
          cat << 'EOF' > /tmp/lite_entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
              <key>com.apple.security.exception.files.absolute-path.read-write</key>
              <array>
                  <string>/</string>
              </array>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Ky lai bang ldid voi day du quyen rootless unsandboxed
          ldid -S/tmp/lite_entitlements.plist "$APP_DIR/TrollStoreLite"
          ldid -S"$ROOT_HELPER_DIR/entitlements.plist" "$APP_DIR/trollstorehelper"

          # Tao postinst tu dong dang ky uicache
          mkdir -p /tmp/deb_pkg/DEBIAN
          cat << 'EOF' > /tmp/deb_pkg/DEBIAN/postinst
          #!/bin/sh
          if [ "$1" = "configure" ] || [ "$1" = "upgrade" ]; then
              if [ -x "/var/jb/usr/bin/uicache" ]; then
                  /var/jb/usr/bin/uicache -p /var/jb/Applications/TrollStoreLite.app
              elif [ -x "/usr/bin/uicache" ]; then
                  /usr/bin/uicache -p /var/jb/Applications/TrollStoreLite.app
              fi
          fi
          exit 0
          EOF
          chmod 755 /tmp/deb_pkg/DEBIAN/postinst

          # Dong goi lai file DEB hoan chinh
          dpkg-deb -b /tmp/deb_pkg "$DEB_FILE"
          rm -rf /tmp/deb_pkg /tmp/lite_entitlements.plist

          echo "=== Danh sach file trong DEB thanh pham ==="
          dpkg-deb -c "$DEB_FILE"

      - name: 6. Luu file DEB thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: TrollStoreLite-Rootless-DEB
          path: ${{ env.TS_LITE_DIR }}/packages/*.deb
