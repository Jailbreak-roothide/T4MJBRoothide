name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat cong cu giai nen
        run: brew install unar

      - name: 2. Tai ma nguon Tieng Viet va TrollStore goc
        run: |
          # 1. Giai nen goi nguon cua ban
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar

          # 2. Tai ban goc TrollStore 2.1.1 chua chu ky CoreTrust chuan
          curl -L -o official.tar "https://github.com/opa334/TrollStore/releases/download/2.1.1/TrollStore.tar"
          mkdir -p package_dir
          tar -xvf official.tar -C package_dir/

      - name: 3. Dong bo va chuan hoa toan bo ban dich Tieng Viet
        run: |
          # Tim thu muc chua ban dich Tieng Viet
          VI_DIR=$(find src_extracted -type d -name "vi.lproj" | head -n 1)
          
          if [ -d "$VI_DIR" ]; then
            echo "Tim thay thu muc ngon ngu Tieng Viet tai: $VI_DIR"
            
            # Kiem tra va convert tat ca file .strings sang UTF-8 chuan Apple
            find "$VI_DIR" -name "*.strings" -exec plutil -lint {} \; || true
            
            # Chep thu muc tieng Viet vao app
            cp -r "$VI_DIR" package_dir/TrollStore.app/
            
            # Chep de them vao Base.lproj de may dat tieng Anh van hien Tieng Viet
            cp -r "$VI_DIR/"* package_dir/TrollStore.app/Base.lproj/ 2>/dev/null || true
          fi

          # Chep cac file Localizable neu nam rieng le
          find src_extracted -name "*Localizable*" -exec cp {} package_dir/TrollStore.app/ \; 2>/dev/null || true

          # Dam bao quyen thuc thi cho file nhi phan
          chmod 755 package_dir/TrollStore.app/TrollStore
          chmod 755 package_dir/TrollStore.app/trollstorehelper
          chmod 755 package_dir/TrollStore.app/PersistenceHelper 2>/dev/null || true

      - name: 4. Dong goi thanh TrollStore.tar
        run: |
          cd package_dir
          tar -cvf ../TrollStore.tar TrollStore.app
          cd ..

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: TrollStore.tar
