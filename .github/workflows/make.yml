name: Tao TrollStore Lite Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TrollStore Lite Rootless (.deb)
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Chuan bi cong cu va ma nguon
        run: |
          brew install unar libarchive ldid openssl@3 dpkg
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "DYLD_LIBRARY_PATH=$OPENSSL_PREFIX/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar

          ROOT_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          TS_APP_DIR=$(find src_extracted -type d -name "TrollStore" | head -n 1)
          TS_LITE_DIR=$(find src_extracted -type d -name "TrollStoreLite" | head -n 1)
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          echo "TS_APP_DIR=$TS_APP_DIR" >> $GITHUB_ENV
          echo "TS_LITE_DIR=$TS_LITE_DIR" >> $GITHUB_ENV

          # Header archive
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          mkdir -p $THEOS/include
          cp "$LIBARCHIVE_PREFIX/include/archive.h" $THEOS/include/
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" $THEOS/include/
          cp "$LIBARCHIVE_PREFIX/include/archive.h" "$TS_LITE_DIR/" 2>/dev/null || true
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" "$TS_LITE_DIR/" 2>/dev/null || true

          # Dong bo Resources
          mkdir -p "$TS_LITE_DIR/Resources"
          if [ -d "$TS_APP_DIR/Resources" ]; then
            cp -r "$TS_APP_DIR/Resources/"* "$TS_LITE_DIR/Resources/" 2>/dev/null || true
          fi

          # Lay helper goc tu opa334 nhet thang vao layout/Resources de Theos dong goi
          curl -L -o official.tar "https://github.com/opa334/TrollStore/releases/download/2.1.1/TrollStore.tar"
          mkdir -p official_extracted
          tar -xvf official.tar -C official_extracted/

          # Copy trollstorehelper vao thang Resources cua TrollStoreLite de no tu dong nam trong bundle .app
          cp official_extracted/TrollStore.app/trollstorehelper "$TS_LITE_DIR/Resources/trollstorehelper"
          chmod 755 "$TS_LITE_DIR/Resources/trollstorehelper"

          # Tao layout DEBIAN postinst cho Theos tu nhan dien va dong goi
          mkdir -p "$TS_LITE_DIR/layout/DEBIAN"
          printf '#!/bin/sh\nHELPER="$JBROOT/Applications/TrollStoreLite.app/trollstorehelper"\nif [ -f "$HELPER" ]; then\n    chown root:wheel "$HELPER"\n    chmod 4755 "$HELPER"\nfi\nuicache -p "$JBROOT/Applications/TrollStoreLite.app" 2>/dev/null || true\nexit 0\n' > "$TS_LITE_DIR/layout/DEBIAN/postinst"
          chmod 755 "$TS_LITE_DIR/layout/DEBIAN/postinst"

      - name: 4. Theos dong goi chuan ROOTLESS
        run: |
          export THEOS=$HOME/theos
          cd "$TS_LITE_DIR"

          make clean || true
          # Chinh xac THEOS_PACKAGE_SCHEME=rootless de Theos tu lo tien to jbroot
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            ADDITIONAL_CFLAGS="-Wno-error" ADDITIONAL_OBJCFLAGS="-Wno-error"

          echo "=== Kiem tra file DEB vua tao ==="
          ls -lh packages/

      - name: 5. Luu file DEB thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: TrollStoreLite-Rootless-DEB
          path: "${{ env.TS_LITE_DIR }}/packages/*.deb"
