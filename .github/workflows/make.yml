name: Tạo TrollStore Lite DEB

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Lite Tiếng Việt (Icon Trắng)
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Giai nen ma nguon va cai dat thu vien
        run: |
          brew install unar libarchive ldid openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "DYLD_LIBRARY_PATH=$OPENSSL_PREFIX/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar
          
          ROOT_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          TS_LITE_DIR=$(find src_extracted -type d -name "TrollStoreLite" | head -n 1)
          echo "TS_LITE_DIR=$TS_LITE_DIR" >> $GITHUB_ENV

          # Chen header archive vao Theos de khi TrollStoreLite bien dich .m khong bao gio thieu
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          mkdir -p $THEOS/include
          cp "$LIBARCHIVE_PREFIX/include/archive.h" $THEOS/include/
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" $THEOS/include/
          cp "$LIBARCHIVE_PREFIX/include/archive.h" "$TS_LITE_DIR/" 2>/dev/null || true
          cp "$LIBARCHIVE_PREFIX/include/archive_entry.h" "$TS_LITE_DIR/" 2>/dev/null || true

      - name: 4. Chuan bi fastPathSign phong khi Theos can
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          git clone --depth 1 --branch 2.1.1 https://github.com/opa334/TrollStore.git ts_official
          cd ts_official
          git submodule update --init --recursive
          cd Exploits/fastPathSign
          sed -i '' 's/"Fat.h"/"FAT.h"/g' src/main.m 2>/dev/null || true
          
          clang -O3 -fobjc-arc \
            -framework Foundation -framework CoreServices -framework Security \
            -I../../ChOma/src \
            -I"$OPENSSL_PREFIX/include" \
            -L"$OPENSSL_PREFIX/lib" -lcrypto \
            ../../ChOma/src/*.c \
            src/main.m src/codesign.m src/coretrust_bug.c \
            -o fastPathSign
          
          chmod 755 fastPathSign
          cd ../../..
          mkdir -p "$ROOT_DIR/Exploits/fastPathSign"
          cp ts_official/Exploits/fastPathSign/fastPathSign "$ROOT_DIR/Exploits/fastPathSign/fastPathSign"
          chmod 755 "$ROOT_DIR/Exploits/fastPathSign/fastPathSign"

      - name: 5. Bien dich TrollStore Lite (Icon trang) va Dong goi DEB
        run: |
          export THEOS=$HOME/theos
          cd "$TS_LITE_DIR"

          make clean || true
          # Chay dung muc tieu TrollStoreLite de dong goi app icon trang
          make package FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error" ADDITIONAL_OBJCFLAGS="-Wno-error"

          echo "=== Danh sach file DEB TrollStore Lite ==="
          ls -lh packages/

      - name: 6. Luu file DEB thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: TrollStoreLite-White-DEB
          path: "**/packages/*.deb"
