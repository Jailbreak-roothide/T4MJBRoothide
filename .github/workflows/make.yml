name: Make TrollStore macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TrollStore Tieng Viet
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos
        uses: actions/setup-theos@v1

      - name: 2. Tai code TrollStore tu Release v2.0
        run: |
          curl -L -o source.zip "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.zip"
          unzip source.zip
          SRC_DIR=$(find . -maxdepth 3 -name "Makefile" -exec dirname {} \; | head -n 1)
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: 3. Chay lenh make
        run: |
          cd $SRC_DIR
          make clean
          make FINALPACKAGE=1

      - name: 4. Xuat file TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: |
            **/TrollStore.tar
            **/packages/*.tar
