name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Giai nen ma nguon va bo sung thu vien ChOma
        run: |
          brew install unar
          curl -L -o source.rar "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.rar"
          unar -o src_extracted source.rar
          TARGET_DIR=$(find src_extracted -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

          # Clone truc tiep ChOma day du de khong bi thieu file FAT.h
          rm -rf "$TARGET_DIR/ChOma"
          git clone --recursive https://github.com/opa334/ChOma.git "$TARGET_DIR/ChOma"

      - name: 4. Bien dich TrollStore Tieng Viet va dong goi TAR
        run: |
          export THEOS=$HOME/theos
          cd "$TARGET_DIR"

          # 1. Bien dich RootHelper (trollstorehelper)
          cd RootHelper
          make clean
          make FINALPACKAGE=1
          cd ..

          # 2. Bien dich TrollStore App
          cd TrollStore
          make clean
          make FINALPACKAGE=1
          cd ..

          # 3. Dong goi thanh TrollStore.tar hoan chinh
          rm -rf package_dir && mkdir -p package_dir
          cp -r TrollStore/.theos/obj/TrollStore.app package_dir/
          cp RootHelper/.theos/obj/trollstorehelper package_dir/TrollStore.app/
          
          cd package_dir
          tar -cvf ../TrollStore.tar TrollStore.app
          cd ..

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: "**/TrollStore.tar"
