name: Tạo TrollStore cho macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Xây dựng TrollStore Tiếng Việt
    runs-on: macos-latest

    steps:
      - name: 1. Cai dat Theos truc tiep
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 2. Cai dat iOS 16.5 SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks-tmp
          cd ~/theos/sdks-tmp
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf ~/theos/sdks-tmp

      - name: 3. Tai ma nguon tu Release v2.0
        run: |
          curl -L -o source.zip "https://github.com/Jailbreak-roothide/T4MJBRoothide/releases/download/v2.0/TrollStore-2.1.1vn.zip"
          unzip source.zip
          TARGET_DIR=$(find . -type d -name "RootHelper" -exec dirname {} \; | head -n 1)
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "Thu muc ma nguon: $TARGET_DIR"

      - name: 4. Chay bien dich TrollStore
        run: |
          cd "$TARGET_DIR"
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1

      - name: 5. Luu file thanh pham TrollStore.tar
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VietNam
          path: |
            **/TrollStore.tar
            **/packages/*.tar
